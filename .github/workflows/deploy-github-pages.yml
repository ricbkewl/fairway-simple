name: Deploy ATG to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: atg-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared library integration
        run: node --test tests/shared-library.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare runtime assets
        run: |
          mkdir _site
          cp *.html *.js *.css *.webmanifest *.png *.jpg _site/
          if [ -d data ]; then cp -r data _site/; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
